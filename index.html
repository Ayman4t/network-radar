<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رادار الشبكة | النت كويس هنا ولا لأ؟</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --bg-dark: #07090e;
            --neon-green: #00ff88;
            --neon-blue: #00d4ff;
            --neon-yellow: #ffb700;
            --neon-red: #ff2a5f;
            --text-main: #eef2f6;
            --text-muted: #8a99ad;
            --accent: var(--neon-blue);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; user-select: none; }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 50% 10%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px 40px;
        }

        .container { width: 100%; max-width: 480px; text-align: center; }

        h1 {
            font-size: 1.7rem;
            font-weight: 900;
            background: linear-gradient(90deg, #fff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .subtitle { color: var(--text-muted); font-size: 0.92rem; margin-bottom: 26px; }

        /* الزر الكبير = الرادار */
        .start-btn {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 24px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            background: radial-gradient(circle, rgba(0, 212, 255, 0.12) 0%, rgba(7, 9, 14, 0.95) 75%);
            box-shadow: 0 0 30px color-mix(in srgb, var(--accent) 35%, transparent), inset 0 0 25px color-mix(in srgb, var(--accent) 20%, transparent);
            color: var(--text-main);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: transform 0.15s ease, border-color 0.3s, box-shadow 0.3s;
        }
        .start-btn:active { transform: scale(0.96); }
        .start-btn:disabled { cursor: default; }

        .start-btn::before, .start-btn::after {
            content: ''; position: absolute; border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            pointer-events: none;
        }
        .start-btn::before { width: 150px; height: 150px; }
        .start-btn::after { width: 80px; height: 80px; }

        .sweep {
            position: absolute; inset: 0; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 70%, rgba(0, 255, 136, 0.5) 100%);
            animation: sweep 2.2s linear infinite;
            display: none;
        }
        .start-btn.scanning .sweep { display: block; }
        @keyframes sweep { to { transform: rotate(360deg); } }

        .btn-main { position: relative; z-index: 2; font-size: 1.7rem; font-weight: 900; line-height: 1.2; padding: 0 10px; }
        .btn-sub { position: relative; z-index: 2; font-size: 0.82rem; color: var(--text-muted); padding: 0 14px; }

        .verdict {
            display: none;
            background: rgba(18, 24, 36, 0.9);
            border: 1.5px solid var(--accent);
            border-radius: 18px;
            padding: 20px 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .verdict-title { font-size: 1.5rem; font-weight: 900; color: var(--accent); margin-bottom: 8px; }
        .verdict-text { font-size: 0.95rem; line-height: 1.7; margin-bottom: 14px; }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .stat {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            padding: 9px 4px;
        }
        .stat b { display: block; font-size: 1.05rem; font-weight: 900; }
        .stat span { font-size: 0.72rem; color: var(--text-muted); }

        .note { margin-top: 18px; font-size: 0.75rem; color: var(--text-muted); line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h1>النت كويس هنا ولا لأ؟ 📡</h1>
    <p class="subtitle">دوس مرة واحدة وهقولك حالة النت في مكانك دلوقتي</p>

    <button class="start-btn" id="startBtn" onclick="runCheck()">
        <div class="sweep"></div>
        <div class="btn-main" id="btnMain">ابدأ الفحص</div>
        <div class="btn-sub" id="btnSub">دوس هنا</div>
    </button>

    <div class="verdict" id="verdict">
        <div class="verdict-title" id="vTitle"></div>
        <div class="verdict-text" id="vText"></div>
        <div class="stats" id="vStats"></div>
    </div>

    <div class="note">💡 افتح الصفحة والموبايل متوصل بالواي فاي (مش داتا). عشان تقارن بين الأوضة والصالة، امشي لمكان تاني ودوس "فحص تاني". الفحص بياخد حوالي 8 ثواني.</div>
</div>

<script>
    let isScanning = false;
    let audioCtx = null;

    const PING_URLS = [
        'https://www.gstatic.com/generate_204',
        'https://cp.cloudflare.com/generate_204'
    ];
    const SAMPLES = 10;
    const PING_TIMEOUT = 2500;
    const SPEED_BYTES = 1000000;
    const SPEED_TIMEOUT = 7000;

    function playBeep(freq = 600, duration = 0.07, type = 'sine') {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch (e) {}
    }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function fetchWithTimeout(url, opts, timeout) {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), timeout);
        return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(t));
    }

    // لو الطلب فشل أو اتأخر يرجع null (فاقد) — مفيش أرقام متألفة
    async function measureSinglePing(url) {
        const start = performance.now();
        try {
            await fetchWithTimeout(url + '?t=' + Date.now() + Math.random(), { mode: 'no-cors', cache: 'no-store' }, PING_TIMEOUT);
            return performance.now() - start;
        } catch (e) {
            return null;
        }
    }

    async function measureSpeed() {
        const start = performance.now();
        try {
            const res = await fetchWithTimeout(
                `https://speed.cloudflare.com/__down?bytes=${SPEED_BYTES}&t=${Date.now()}`,
                { cache: 'no-store' }, SPEED_TIMEOUT
            );
            const buf = await res.arrayBuffer();
            const sec = (performance.now() - start) / 1000;
            if (!buf.byteLength || sec <= 0) return null;
            return (buf.byteLength * 8) / sec / 1e6;
        } catch (e) {
            return null;
        }
    }

    const median = arr => {
        const s = [...arr].sort((a, b) => a - b);
        const m = Math.floor(s.length / 2);
        return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
    };

    function setAccent(color) {
        document.documentElement.style.setProperty('--accent', color);
    }

    function showVerdict(color, title, text, stats) {
        setAccent(color);
        document.getElementById('vTitle').innerText = title;
        document.getElementById('vText').innerHTML = text;
        document.getElementById('vStats').innerHTML = stats
            ? stats.map(s => `<div class="stat"><b>${s.v}</b><span>${s.l}</span></div>`).join('')
            : '';
        document.getElementById('verdict').style.display = 'block';
    }

    async function runCheck() {
        if (isScanning) return;

        const btn = document.getElementById('startBtn');
        const main = document.getElementById('btnMain');
        const sub = document.getElementById('btnSub');
        document.getElementById('verdict').style.display = 'none';
        setAccent('var(--neon-blue)');

        if (!navigator.onLine) {
            main.innerText = '❌';
            sub.innerText = 'فحص تاني';
            showVerdict('var(--neon-red)', 'مفيش نت ❌',
                'الموبايل مش متوصل بأي شبكة. اتأكد إن الواي فاي شغال ومتوصل بالراوتر.', null);
            playBeep(200, 0.25, 'sawtooth');
            return;
        }

        isScanning = true;
        btn.disabled = true;
        btn.classList.add('scanning');
        sub.innerText = 'بيفحص النت...';

        main.innerText = '...';
        await measureSinglePing(PING_URLS[0]); // تسخين (بيتشال من الحساب)

        const pings = [];
        let lost = 0;
        for (let i = 0; i < SAMPLES; i++) {
            playBeep(450 + i * 60, 0.06);
            main.innerText = Math.round(((i + 1) / (SAMPLES + 1)) * 100) + '%';
            const p = await measureSinglePing(PING_URLS[i % PING_URLS.length]);
            if (p === null) lost++; else pings.push(p);
            await sleep(150);
        }

        sub.innerText = 'بيقيس السرعة...';
        const speed = await measureSpeed();

        btn.classList.remove('scanning');
        btn.disabled = false;
        isScanning = false;
        sub.innerText = 'فحص تاني';

        // مفيش ولا رد = مفيش إنترنت فعلي
        if (pings.length === 0) {
            main.innerText = '❌';
            showVerdict('var(--neon-red)', 'مفيش إنترنت ❌',
                'الموبايل متوصل بشبكة بس مفيش أي رد من النت. جرب تقرّب من الراوتر، أو اعمله إعادة تشغيل، أو اتأكد إن الخط شغال.', null);
            playBeep(200, 0.25, 'sawtooth');
            return;
        }

        const ping = Math.round(median(pings));
        let jitterSum = 0;
        for (let i = 1; i < pings.length; i++) jitterSum += Math.abs(pings[i] - pings[i - 1]);
        const jitter = pings.length > 1 ? Math.round(jitterSum / (pings.length - 1)) : 0;
        const loss = Math.round((lost / SAMPLES) * 100);
        const mbps = speed === null ? null : Math.round(speed * 10) / 10;

        let score = 100;
        score -= Math.max(0, ping - 40) * 0.25;
        score -= jitter * 1.2;
        score -= loss * 2.5;
        if (mbps === null) score -= 25;
        else if (mbps < 2) score -= 30;
        else if (mbps < 5) score -= 18;
        else if (mbps < 10) score -= 8;
        score = Math.max(5, Math.min(99, Math.round(score)));

        // السبب الأساسي لو النت مش تمام
        let reason = '';
        if (loss >= 20) reason = 'الإشارة بتقطع وبتفقد طلبات كتير.';
        else if (mbps !== null && mbps < 5) reason = 'السرعة ضعيفة.';
        else if (jitter > 40) reason = 'النت مش ثابت وبيتذبذب.';
        else if (ping > 150) reason = 'الرد بطيء.';

        let color, title, text;
        if (score >= 75) {
            color = 'var(--neon-green)';
            title = 'النت كويس هنا ✅';
            text = 'الاتصال سريع وثابت في المكان ده. تقدر تلعب وتتفرج وتشتغل عادي.';
        } else if (score >= 50) {
            color = 'var(--neon-yellow)';
            title = 'النت متوسط ⚠️';
            text = `النت شغال بس مش مثالي. ${reason} ممكن تحس بتقطيع في الألعاب أو المكالمات. جرب تقرّب من الراوتر.`;
        } else {
            color = 'var(--neon-red)';
            title = 'النت وحش هنا 💀';
            text = `المكان ده نقطة ضعيفة. ${reason} قرّب من الراوتر أو غيّر مكان الراوتر، ولو نفس المشكلة جنب الراوتر يبقى العيب من الخط نفسه.`;
        }

        main.innerText = score + '%';
        showVerdict(color, title, text, [
            { v: ping + 'ms', l: 'البينج' },
            { v: loss + '%', l: 'فاقد' },
            { v: mbps === null ? '—' : mbps + ' Mbps', l: 'السرعة' }
        ]);
        playBeep(score >= 50 ? 880 : 250, 0.2, score >= 50 ? 'triangle' : 'sawtooth');
    }
</script>

</body>
</html>
